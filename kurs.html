<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Kurs Dollar & Rupiah</title>
</head>
<body>
    <h2>Menghitung Kurs Dollar & Rupiah</h2>
    <h4> Nilai Kurs Rupiah = Rp. 16.600</h4>
    <label for="dollar">Dollar =</label>
    <input type="number" id="dollar">
    <br>
    <button type="Button" onclick="hitung_dolar()">Hitung</button>

    <hr>
    <br>
    <h2>Rupiah to Dollar</h2>
    <label for="rupiah">Rupiah =</label>
    <input type="number" id="rupiah">
    <br>
    <button type="Button" onclick="hitung_rupiah()">Hitung</button>

    <script>
        function hitung_dolar() {
            let rupiah = 16668;
            let d = document.getElementById("dollar").value;

            let hasil_dolar = d * rupiah;
            document.getElementById("hasil1").innerHTML = "Hasil: Rp. " + hasil_dolar;
        }

        function hitung_rupiah() {
            let rupiah2 = document.getElementById("rupiah").value;

            let hasil_rupiah = rupiah2* (1/ 16668);
            document.getElementById("hasil2").innerHTML = "Hasil: $ " + hasil_rupiah;   
        }
    </script>
</body>
</html>
